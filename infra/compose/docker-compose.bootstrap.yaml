services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: nyc-taxi-localstack
    ports:
      - "${LOCALSTACK_HOST_PORT}:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      DEBUG: ${LOCALSTACK_DEBUG}
      PERSISTENCE: ${LOCALSTACK_PERSISTENCE}
      BOOTSTRAP_BUCKET_NAME: ${BOOTSTRAP_BUCKET_NAME}
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ../localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh

  bootstrap-downloader:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.bootstrap
    container_name: nyc-taxi-bootstrap
    env_file:
      - ../env/.env.localstack
    volumes:
      - ${HOST_DATA_DIR}:/app/data
    working_dir: /app
    # command: [ "python", "-m", "nyc_taxi_data_service.bootstrap.pipeline" ]
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  localstack_data:
