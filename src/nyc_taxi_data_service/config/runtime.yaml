active_environment: dev

defaults:
  manifest:
    output_path: data/manifests
  
  logging:
    level: INFO
  
  serving:
    # Mapping from vehicle type to the timestamp column used as the event time
    # for the data service.
    #
    # The mimic current datetime defines the boundary between historic data
    # and real-time data:
    #   event_time <  mimic current datetime -> historic data (API)
    #   event_time >= mimic current datetime -> real-time data (streaming)
    #
    # Each vehicle type uses a different timestamp column due to schema differences.
    service_event_time_column_by_vehicle_type:
      yellow: "tpep_dropoff_datetime"
      green: "lpep_dropoff_datetime"
      fhv: "dropOff_datetime"
      fhvhv: "dropoff_datetime"


environments:
  dev:
    logging:
      level: DEBUG

    storage:
      target_storage_type: local
      # group settings by type
      local_settings:
        target_base_path: data/raw

    time_frame:
      # earliest month the user wants to request
      start_year_month: "2025-01"
      end_year_month: "2025-03"

    vehicle_types:
      - yellow
      - green
      # - fhv
      # - fhvhv

    serving:
      mimic_current_date: "2025-01-15"
