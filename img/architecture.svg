<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="805" viewBox="-445 0 1500 805">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f78ad"/>
  </marker>
  <style>
    .line{stroke:#1f78ad;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#1f78ad;stroke-width:2.2;fill:none;stroke-dasharray:7 7;marker-end:url(#arrow)}
    .box{fill:#f5f9fc;stroke:#1f78ad;stroke-width:2}
    .group{fill:#f7fafc;fill-opacity:.92;stroke:#1f78ad;stroke-width:2}
    .text{font-family:Arial,Helvetica,sans-serif;fill:#27364a;font-size:22px}
    .small{font-family:Arial,Helvetica,sans-serif;fill:#27364a;font-size:19px}
    .labelbg{fill:#fff;fill-opacity:.92}
  </style>
</defs>

